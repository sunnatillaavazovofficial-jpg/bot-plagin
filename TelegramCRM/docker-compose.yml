services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - crm-data:/data
    expose:
      - "8000"
    # Faqat serverning ichidan ochiq: serverda boshqa veb-server (nginx/apache) bo'lsa, u shu portga yo'naltiradi
    ports:
      - "127.0.0.1:${APP_PORT:-8181}:8000"

  # Caddy (avtomatik HTTPS) — .env da COMPOSE_PROFILES=caddy bo'lsa ishga tushadi.
  # Serverda 80/443-portni boshqa sayt egallagan bo'lsa, install.sh uni o'chirib, mavjud veb-server orqali ulaydi.
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domen bo'lsa — avtomatik HTTPS. Bo'lmasa — oddiy http (80-port)
      DOMAIN: ${DOMAIN:-:80}
      # www.domen → domen yo'naltirish (ixtiyoriy)
      WWW_DOMAIN: ${WWW_DOMAIN:-:8082}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  crm-data:
  caddy-data:
  caddy-config:
