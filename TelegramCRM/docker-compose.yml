services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - crm-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domen bo'lsa — avtomatik HTTPS. Bo'lmasa — oddiy http (80-port)
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  crm-data:
  caddy-data:
  caddy-config:
