# /etc/nginx/sites-available/pp-design
# Keyin: sudo ln -s /etc/nginx/sites-available/pp-design /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS ni certbot o'zi qo'shadi: sudo certbot --nginx -d pp-design.duckdns.org

server {
    listen 80;
    server_name pp-design.duckdns.org;

    # Intro video va rasmlar yuklash uchun
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
